plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.bingwall'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.bingwall'
        // DreamService and java.time: Android 8 and up, as the launcher.
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The unit tests parse a real feed with org.json, which is an Android class with no JVM body: without
    // this the stub throws and every parsing test would "pass" against an empty list.
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
